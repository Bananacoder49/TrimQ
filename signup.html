<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <!-- Makes the page fit phone screens properly -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Create Account – TrimQ</title>

  <!-- Poppins font from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Shares the same stylesheet as the home page -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="app">

    <!-- ===== HEADER: back link and logo placeholder ===== -->
    <header class="block top short">
      <a class="back" href="index.html">&larr; Back</a>
      <div class="logo">LOGO HERE</div>
    </header>

    <!-- ===== SIGN-UP FORM: username, email, password ===== -->
    <section class="block login-card" aria-labelledby="signup-title">
      <h1 id="signup-title">Create your account</h1>

      <form id="signup-form" novalidate>

        <!-- Username field -->
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="e.g. marco" autocomplete="username" required>
        </div>

        <!-- Email field -->
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        </div>

        <!-- Password field with a Show/Hide button -->
        <div class="field">
          <label for="password">Password (at least 8 characters)</label>
          <div class="pw-wrap">
            <input type="password" id="password" name="password" placeholder="Choose a password" autocomplete="new-password" required>
            <button class="pw-toggle" id="pw-toggle" type="button" aria-controls="password">Show</button>
          </div>
        </div>

        <!-- Message area: errors and success appear here -->
        <div class="form-msg" id="form-msg" role="status"></div>

        <button class="submit" type="submit">CREATE ACCOUNT</button>
      </form>

      <!-- Link back to the login page -->
      <div class="helper">
        <span>Already have an account?</span>
        <a href="login.html">Log in</a>
      </div>
    </section>

    <!-- ===== FOOTER: contact details (same as the home page) ===== -->
    <footer class="block foot" id="contact">
      <a href="tel:12345678901">
        <span class="bi" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
            <path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z" />
          </svg>
        </span>
        CALL: 12345678901
      </a>

      <a href="mailto:1234@gmail.com">
        <span class="bi" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="m3 7 9 6 9-6" />
          </svg>
        </span>
        EMAIL: 1234@gmail.com
      </a>
    </footer>

  </main>

  <!-- Backend address (see config.js). Leave it empty to run in demo mode. -->
  <script src="config.js"></script>

  <script>
    /* ==========================================================
       Sign-up behaviour
       Demo mode (no server address in config.js): only checks the
       fields. Database mode: creates the account on the server.
       ========================================================== */
    (function () {

      /* ---- Server address from config.js (empty = demo mode) ---- */
      var API = (window.TRIMQ_API || "").replace(/\/$/, "");

      /* ---- Grab the page elements we need ---- */
      var form = document.getElementById("signup-form");
      var userEl = document.getElementById("username");
      var emailEl = document.getElementById("email");
      var passEl = document.getElementById("password");
      var toggle = document.getElementById("pw-toggle");
      var msg = document.getElementById("form-msg");

      /* ---- SHOW / HIDE button ---- */
      toggle.addEventListener("click", function () {
        var hidden = passEl.type === "password";
        passEl.type = hidden ? "text" : "password";
        toggle.textContent = hidden ? "Hide" : "Show";
      });

      /* Goes to the login page after a short pause */
      function goLogin() {
        setTimeout(function () {
          window.location.href = "login.html";
        }, 1200);
      }

      /* ---- FORM SUBMIT: checks the fields, then creates the account ---- */
      form.addEventListener("submit", function (ev) {
        ev.preventDefault();

        var username = userEl.value.trim();
        var email = emailEl.value.trim();
        var password = passEl.value;

        if (username.length < 3) {
          msg.textContent = "Username must be at least 3 characters.";
          userEl.focus();
          return;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          msg.textContent = "Please enter a valid email address.";
          emailEl.focus();
          return;
        }
        if (password.length < 8) {
          msg.textContent = "Password must be at least 8 characters.";
          passEl.focus();
          return;
        }

        /* Demo mode: no account is really created */
        if (!API) {
          msg.textContent = "Account created (demo). Redirecting…";
          goLogin();
          return;
        }

        /* Database mode: ask the server to create the account */
        var submitBtn = form.querySelector(".submit");
        submitBtn.disabled = true;
        msg.textContent = "";

        fetch(API + "/api/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: username, email: email, password: password })
        })
          .then(function (r) {
            return r.json().then(function (data) {
              return { ok: r.ok, data: data };
            });
          })
          .then(function (res) {
            if (!res.ok) {
              msg.textContent = res.data.error || "Could not create the account.";
              return;
            }
            msg.textContent = "Account created! Redirecting to login…";
            goLogin();
          })
          .catch(function () {
            msg.textContent = "Could not reach the server. Please try again.";
          })
          .then(function () {
            submitBtn.disabled = false;
          });
      });

    })();
  </script>
</body>

</html>
