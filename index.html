<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <!-- Makes the page fit phone screens properly -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TrimQ</title>

  <!-- Poppins font from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- All styling lives in style.css (keep it in the same folder as this file) -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="app">

    <!-- ===== HEADER: logo placeholder and login link ===== -->
    <header class="block top">
      <a class="login" href="login.html">LOGIN</a>
      <div class="logo">LOGO HERE</div>
    </header>

    <!-- ===== QUEUE STATUS BAR =====
         Shows who is being served, your queue number, and your wait.
         The values are updated by the script at the bottom of this file. -->
    <section class="block status" aria-label="Queue status" aria-live="polite">
      <div class="stat">
        <span class="dot" aria-hidden="true"></span>
        <div>Now Serving<b id="serving">0</b></div>
      </div>

      <div class="stat mid">
        <span class="dot" aria-hidden="true"></span>
        <div><span>Queue ID</span><b id="qid" style="color: var(--on-block)">1</b></div>
      </div>

      <div class="stat">
        <span class="dot" aria-hidden="true"></span>
        <div>Estimated Time<b id="eta">00:00</b></div>
      </div>
    </section>

    <!-- ===== JOIN QUEUE BUTTON: opens the queue page ===== -->
    <a class="block action" id="join" href="queue.html" style="text-decoration: none">
      <span class="ico" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="9" cy="8" r="3.5" />
          <path d="M2.5 20c.5-4 3-6 6.5-6s6 2 6.5 6" />
          <path d="M17 5v6M14 8h6" />
        </svg>
      </span>
      <span class="lbl">JOIN QUEUE</span>
    </a>

    <!-- ===== BOOK APPOINTMENT BUTTON: opens the booking page ===== -->
    <a class="block action" id="book" href="book.html" style="text-decoration: none">
      <span class="ico" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <rect x="3.5" y="5" width="17" height="15" rx="2.5" />
          <path d="M3.5 10h17M8 3v4M16 3v4" />
        </svg>
      </span>
      <span class="lbl">BOOK APPOINTMENT</span>
    </a>

    <!-- ===== RECOMMENDED HAIRCUTS: heading, menu button, and three cards ===== -->
    <section aria-labelledby="rec">
      <div class="rec-head">
        <h2 id="rec">Recommended<br>Haircuts</h2>

        <!-- Hamburger button: opens and closes the menu below -->
        <button class="burger" id="burger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="menu">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>

        <!-- Dropdown menu (hidden until the hamburger button is clicked) -->
        <nav class="menu" id="menu" aria-label="Menu">
          <a href="login.html">Login</a>
          <a href="book.html">Book appointment</a>
          <a href="#contact">Contact</a>
        </nav>
      </div>

      <!-- Haircut cards: replace "IMAGE" with an <img> tag, and edit names and prices -->
      <div class="cuts">
        <div class="cut">
          <div class="img">IMAGE</div>
          <div class="name">HAIRCUT 1</div>
          <div class="price">$ 10</div>
        </div>

        <div class="cut">
          <div class="img">IMAGE</div>
          <div class="name">HAIRCUT 2</div>
          <div class="price">$ 15</div>
        </div>

        <div class="cut">
          <div class="img">IMAGE</div>
          <div class="name">HAIRCUT 3</div>
          <div class="price">$ 25</div>
        </div>
      </div>
    </section>

    <!-- ===== FOOTER: contact details (tap to call or email on a phone) ===== -->
    <footer class="block foot" id="contact">
      <a href="tel:12345678901">
        <span class="bi" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
            <path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z" />
          </svg>
        </span>
        CALL: 12345678901
      </a>

      <a href="mailto:1234@gmail.com">
        <span class="bi" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="m3 7 9 6 9-6" />
          </svg>
        </span>
        EMAIL: 1234@gmail.com
      </a>
    </footer>

  </main>

  <script>
    /* ==========================================================
       Page behaviour (demo only: the queue is not saved anywhere yet)
       ========================================================== */
    (function () {

      /* ---- Queue state ---- */
      var serving = 0;     // number currently being served
      var qid = 1;         // the visitor's queue number
      var joined = false;  // has the visitor joined yet?
      var MIN = 20;        // assumed minutes per customer, for the wait estimate

      /* ---- Grab the page elements we need to update ---- */
      var servingEl = document.getElementById("serving");
      var qidEl = document.getElementById("qid");
      var etaEl = document.getElementById("eta");

      /* Adds a leading zero, e.g. 5 -> "05" */
      function pad(n) {
        return n < 10 ? "0" + n : "" + n;
      }

      /* Redraws the status bar: Now Serving, Queue ID and Estimated Time (HH:MM) */
      function render() {
        servingEl.textContent = serving;
        qidEl.textContent = qid;

        var minutes = joined ? Math.max(qid - serving, 0) * MIN : 0;
        etaEl.textContent = pad(Math.floor(minutes / 60)) + ":" + pad(minutes % 60);
      }

      /* ---- HAMBURGER button: shows or hides the dropdown menu ---- */
      var burger = document.getElementById("burger");
      var menu = document.getElementById("menu");

      burger.addEventListener("click", function () {
        var isOpen = menu.classList.toggle("open");
        burger.setAttribute("aria-expanded", isOpen);
      });

      /* Draw the status bar once when the page loads */
      render();

    })();
  </script>
</body>

</html>
